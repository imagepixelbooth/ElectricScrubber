<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">

    <style>
        /* Sharing same root styles for consistency */
        :root {
            --bg-midnight: #050510;
            --bg-offwhite: #d0d2d5;
            --bg-charcoal: #12121a;
            --accent-cyan: #00f2ea;
            --accent-blue: #00a8ff;
            --accent-red: #ff4757;
            --text-main-dark: #ffffff;
            --text-sec-dark: #a0a0b0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);

            /* Fonts */
            --font-body: 'Inter', sans-serif;
            --font-heading: 'Special Gothic Expanded One', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-midnight);
            color: var(--text-main-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Gradient Orb */
        .orb {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(0, 242, 234, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            animation: pulse 6s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem 2rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00f2ea 0%, #00a8ff 100%);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(0, 242, 234, 0.3);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #a0a0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sec-dark);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2ea 0%, #00a8ff 100%);
            color: #000;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 168, 255, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 168, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="orb"></div>

    <div class="card">
        <div class="check-icon">✓</div>
        <h1>Order Confirmed!</h1>
        <p>Thank you for your purchase. We have received your order and have sent a confirmation email with details.</p>
        <a href="index.html" class="btn-primary">Back to Home</a>
    </div>

</body>

</html>
